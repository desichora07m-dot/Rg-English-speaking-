name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | awk -F '"' '/version/ {print $2}')
          if [ -z "$JAVA_VER" ]; then
            echo "Error: Could not detect Java version."
            exit 1
          fi
          echo "Detected Java version string: $JAVA_VER"
          MAJOR_VER=$(echo "$JAVA_VER" | awk -F. '{if ($1 == "1") {print $2} else {print $1}}')
          echo "Detected Java major version: $MAJOR_VER"
          if [ -z "$MAJOR_VER" ] || ! [ "$MAJOR_VER" -ge 17 ] 2>/dev/null; then
            echo "Error: Java major version must be 17 or higher. Found: $MAJOR_VER"
            exit 1
          fi
          echo "Java environment verified: version $MAJOR_VER is 17 or newer."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists. Skipping creation."
          else
            echo "Creating temporary debug keystore..."
            keytool -genkeypair \
              -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            if [ ! -f "./debug.keystore" ]; then
              echo "Error: Failed to create ./debug.keystore"
              exit 1
            fi
            echo "Temporary debug keystore created successfully."
          fi

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify debug APK
        run: |
          APK_FILE="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_FILE" ]; then
            echo "Error: Expected debug APK not found at $APK_FILE"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi

          if [ ! -s "$APK_FILE" ]; then
            echo "Error: $APK_FILE exists but is empty."
            exit 1
          fi

          case "$APK_FILE" in
            *.apk) ;;
            *)
              echo "Error: $APK_FILE does not have .apk extension."
              exit 1
              ;;
          esac

          echo "Verified debug APK: $APK_FILE (size: $(wc -c < "$APK_FILE") bytes)"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          APK_SRC="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_SRC" ] || [ ! -s "$APK_SRC" ]; then
            echo "Error: Source APK $APK_SRC is missing or empty."
            exit 1
          fi

          TEMP_ASSET_DIR=$(mktemp -d -t apk-release-XXXXXX)
          REPO_RAW="${{ github.repository }}"
          REPO_BASE="${REPO_RAW##*/}"
          REPO_SAFE=$(echo "$REPO_BASE" | tr '[:upper:]' '[:lower:]' | sed -E 's/[^a-z0-9._-]+/-/g' | sed -E 's/^-+|-+$//g')
          if [ -z "$REPO_SAFE" ]; then
            REPO_SAFE="android-app"
          fi

          RUN_NUM="${{ github.run_number }}"
          ASSET_FILENAME="${REPO_SAFE}-debug-build-${RUN_NUM}.apk"
          DEST_FILE="${TEMP_ASSET_DIR}/${ASSET_FILENAME}"

          cp "$APK_SRC" "$DEST_FILE"

          if [ ! -f "$DEST_FILE" ] || [ ! -s "$DEST_FILE" ]; then
            echo "Error: Failed to prepare release asset at $DEST_FILE"
            exit 1
          fi

          echo "asset_path=$DEST_FILE" >> "$GITHUB_OUTPUT"
          echo "asset_name=$ASSET_FILENAME" >> "$GITHUB_OUTPUT"
          echo "Prepared release asset: $DEST_FILE (filename: $ASSET_FILENAME)"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version

          RELEASE_ASSET="${{ steps.prepare_asset.outputs.asset_path }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ -z "$RELEASE_ASSET" ] || [ ! -f "$RELEASE_ASSET" ] || [ ! -s "$RELEASE_ASSET" ]; then
            echo "Error: Prepared release asset is missing or empty."
            exit 1
          fi

          case "$RELEASE_ASSET" in
            *.apk) ;;
            *)
              echo "Error: Release asset is not an .apk file."
              exit 1
              ;;
          esac

          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"

          NOTES=$(cat <<EOF
          ## Automated Debug APK Build
          - **Build Source**: Automatically built by GitHub Actions.
          - **Run Number**: ${{ github.run_number }}
          - **Run Attempt**: ${{ github.run_attempt }}
          - **Commit SHA**: \`${{ github.sha }}\`
          - **Purpose**: This APK is intended for testing and development preview.
          - **Notice**: This APK is not a Play Store production release and is signed only with a temporary debug keystore.

          ### Download APK
          Download the debug APK directly from the **Assets** section below:
          - \`$ASSET_NAME\`
          EOF
          )

          echo "Creating release with tag: $RELEASE_TAG and title: $RELEASE_TITLE"
          gh release create "$RELEASE_TAG" "$RELEASE_ASSET" \
            --title "$RELEASE_TITLE" \
            --notes "$NOTES" \
            --target "${{ github.sha }}" \
            --latest

          echo "release_tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "release_title=$RELEASE_TITLE" >> "$GITHUB_OUTPUT"

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          RELEASE_STATUS="${{ steps.publish_release.outcome }}"
          RELEASE_TAG="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_NAME="${{ steps.prepare_asset.outputs.asset_name }}"

          if [ "$RELEASE_STATUS" = "success" ]; then
            echo "=========================================================="
            echo " GitHub Release Succeeded!"
            echo "=========================================================="
            gh release view "$RELEASE_TAG"
            RELEASE_URL="https://github.com/${{ github.repository }}/releases/tag/${RELEASE_TAG}"
            echo "Release Tag: $RELEASE_TAG"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "APK Asset Filename: $ASSET_NAME"
            echo "=========================================================="

            {
              echo "## 🚀 Debug APK Build & Release Summary"
              echo ""
              echo "✅ **Debug APK successfully built and published!**"
              echo ""
              echo "- **Release Tag**: \`$RELEASE_TAG\`"
              echo "- **Release Title**: Debug APK Build #${{ github.run_number }}"
              echo "- **Direct Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **APK Asset**: \`$ASSET_NAME\`"
              echo ""
              echo "📱 **Download Instructions**: Open the release link above on your phone or browser, scroll to **Assets**, and download \`$ASSET_NAME\` directly."
              echo ""
              echo "📦 *Note*: The standard GitHub Actions artifact named \`app-debug-apk\` is also preserved and available in the workflow run summary."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing failed or was skipped. However, the APK build succeeded!"
            echo "The debug APK artifact named 'app-debug-apk' was preserved in this workflow run."

            {
              echo "## ⚠️ Debug APK Build Summary"
              echo ""
              echo "✅ **Debug APK successfully built and verified!**"
              echo ""
              echo "⚠️ **GitHub Release publishing did not complete**, but your build artifact was not lost."
              echo ""
              echo "📦 **Download Artifact**: You can download the debug APK from the **Artifacts** section at the top/bottom of this workflow run page (Artifact name: \`app-debug-apk\`)."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
